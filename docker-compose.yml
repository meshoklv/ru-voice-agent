# Quick start:
#   cp .env.example .env
#   docker compose run --rm app python scripts/download_models.py
#   docker compose up -d ollama && docker compose exec ollama ollama pull qwen3:8b
#   docker compose up -d app
#   docker compose logs app | grep token    # or: cat data/token
#
# The app is published on 127.0.0.1 ONLY. To expose it, put a TLS reverse proxy in
# front (see README, Security). Nothing here listens on a public interface.
services:
  app:
    build:
      context: .
      args:
        WITH_KOKORO: ${WITH_KOKORO:-0}
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_URL: ${OLLAMA_URL_IN_DOCKER:-http://ollama:11434}
    # run as your own user so that ./data/token and ./models are yours (default uid 1000)
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "127.0.0.1:${VOICE_PORT:-7693}:7693"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    # CPU works but is slow for an 8B model. For an NVIDIA GPU add:
    #   deploy: {resources: {reservations: {devices: [{driver: nvidia, count: all, capabilities: [gpu]}]}}}
    volumes:
      - ollama:/root/.ollama
    # no "ports": only the app container talks to it
    restart: unless-stopped

volumes:
  ollama:
